spring:
  application:
    name: unshare
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unshare}
    username: ${DB_USERNAME:unshare}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  share:
    default-ttl-minutes: ${SHARE_DEFAULT_TTL_MINUTES:30}
    max-ttl-minutes: ${SHARE_MAX_TTL_MINUTES:180}
    max-files: ${SHARE_MAX_FILES:50}
    max-total-size-bytes: ${SHARE_MAX_TOTAL_SIZE_BYTES:10737418240}
    default-max-receivers: ${SHARE_DEFAULT_MAX_RECEIVERS:1}
    max-allowed-receivers: ${SHARE_MAX_ALLOWED_RECEIVERS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: INFO
    in.unshare: INFO
